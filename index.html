<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f1f8" />
    <title>수행평가 일정</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
  </head>
  <body>
    <header class="topbar"><div id="connectionStatus" class="connection-status"><i></i><span>연결 확인 중</span></div><button id="authButton" class="profile" type="button">관리자 로그인</button></header>
    <main id="top">
      <section class="page-heading"><p class="eyebrow">CLASS BOARD</p><div class="heading-row"><div><h1>수행평가 일정</h1><p id="updatedLabel" class="heading-copy">과목별 날짜와 준비물을 확인하세요.</p></div><button id="addButton" class="primary-button admin-only" type="button" hidden>＋ 일정 추가</button></div></section>
      <section class="board-section" id="board">
        <div class="toolbar"><div class="filter-row" id="filters" aria-label="과목 필터"><button class="filter active" data-subject="전체" type="button">전체</button><button class="filter" data-subject="국어" type="button">국어</button><button class="filter" data-subject="수학" type="button">수학</button><button class="filter" data-subject="영어" type="button">영어</button><button class="filter" data-subject="과학" type="button">과학</button><button class="filter" data-subject="사회" type="button">사회</button><button class="filter" data-subject="기타" type="button">기타</button></div><span id="resultLabel" class="result-label"></span></div>
        <div id="assessmentList" class="assessment-list" aria-live="polite"></div>
        <div id="emptyState" class="empty-state" hidden><strong>등록된 일정이 없습니다.</strong><p>새 수행평가 일정은 이곳에서 확인할 수 있습니다.</p></div>
      </section>
      <footer>수행평가 일정</footer>
    </main>
    <dialog id="authDialog" class="dialog"><form id="authForm" class="dialog-card"><button class="close-button" type="button" data-close aria-label="닫기">×</button><p class="eyebrow">ADMIN ACCESS</p><h2>관리자 로그인</h2><p class="dialog-help">관리자 계정으로 로그인하면 게시물을 관리할 수 있습니다.</p><label>이메일<input id="emailInput" type="email" autocomplete="username" required placeholder="관리자 이메일" /></label><label>비밀번호<input id="passwordInput" type="password" autocomplete="current-password" required placeholder="비밀번호" /></label><p id="authMessage" class="form-message" role="status"></p><button class="primary-button full-button" type="submit">로그인</button><div id="previewLogin" class="preview-login" hidden><span>연결 설정 전 미리보기</span><button id="previewButton" class="text-button" type="button">관리자 화면 보기 →</button></div></form></dialog>
    <dialog id="assessmentDialog" class="dialog"><form id="assessmentForm" class="dialog-card assessment-dialog-card"><button class="close-button" type="button" data-close aria-label="닫기">×</button><p class="eyebrow">CLASS NOTICE</p><h2 id="editorTitle">수행평가 일정 추가</h2><p class="dialog-help">필요한 내용을 입력하고 저장하세요.</p><input id="assessmentId" type="hidden" /><label>과목<select id="subjectInput" required><option value="국어">국어</option><option value="수학">수학</option><option value="영어">영어</option><option value="과학">과학</option><option value="사회">사회</option><option value="기타">기타</option></select></label><label>수행평가 제목<input id="titleInput" maxlength="100" required placeholder="예: 2단원 발표 평가" /></label><label>설명<textarea id="descriptionInput" maxlength="1200" required rows="4" placeholder="평가 내용과 진행 방법"></textarea></label><label>수행평가 날짜<input id="dateInput" type="date" required /></label><label>준비물<input id="suppliesInput" maxlength="300" placeholder="준비물 (없으면 비워두세요)" /></label><label>학급<input id="classInput" maxlength="40" placeholder="예: 2학년 3반" /></label><p id="saveMessage" class="form-message" role="status"></p><button class="primary-button full-button" type="submit">저장하기</button></form></dialog>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
